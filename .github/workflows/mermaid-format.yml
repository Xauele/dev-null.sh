name: Format Mermaid candidate on fork

on:
  push:
    branches: [ci/mermaid-format-20261026]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: |
          NODE_OPTIONS='--experimental-strip-types' bunx vp fmt resources/js/components/commit-body.tsx resources/js/components/mermaid-diagram.tsx resources/js/lib/mermaid-renderer.ts
          git diff --stat
      - name: Commit formatted files on fork harness only
        run: |
          if git diff --quiet -- resources/js/components/commit-body.tsx resources/js/components/mermaid-diagram.tsx resources/js/lib/mermaid-renderer.ts; then
            exit 0
          fi
          git add resources/js/components/commit-body.tsx resources/js/components/mermaid-diagram.tsx resources/js/lib/mermaid-renderer.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format Mermaid component'
          git push origin HEAD:ci/mermaid-format-20261026
