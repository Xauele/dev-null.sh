name: Generate Mermaid lockfile on fork

on:
  push:
    branches: [ci/mermaid-lock-20261026]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Refresh lockfile
        run: |
          bun install
          bun install --frozen-lockfile
          git status --short
      - name: Commit generated lockfile back to fork harness
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Lockfile is already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' add bun.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: refresh Mermaid lockfile'
          git push origin HEAD:ci/mermaid-lock-20261026
